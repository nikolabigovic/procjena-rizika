spring:
  application:
    name: procjena-rizika


  datasource:
    url: jdbc:mysql://localhost:3306/rizik_db
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: "${JWT_SECRET}"
  ttl: 30
  refresh: 90
