<div class="wrap">
  <form class="reg" [formGroup]="form" (ngSubmit)="registrujSe()">
    <div class="logo lg">AML</div>
    <div class="naslov">
      <h1>Registracija firme</h1>
      <p class="note">Unesite podatke o firmi i administratoru naloga.</p>
    </div>

    <fieldset class="sekcija" formGroupName="firma">
      <legend>Podaci o firmi</legend>
      <div class="grid2">
        <label class="field">Naziv firme *
          <input type="text" formControlName="nazivFirme" autocomplete="organization">
        </label>
        <label class="field">PIB *
          <input type="text" formControlName="pib">
        </label>
        <label class="field">Sjedište *
          <input type="text" formControlName="sjediste">
        </label>
        <label class="field">Šifra djelatnosti *
          <input type="text" formControlName="sifraDjelatnosti" placeholder="npr. 47.11">
        </label>
        <label class="field">Datum osnivanja *
          <input type="date" formControlName="datumOsnivanja">
        </label>
        <label class="field">Telefon *
          <input type="tel" formControlName="telefon" autocomplete="tel">
        </label>
        <label class="field">E-mail firme *
          <input type="email" formControlName="email" autocomplete="email">
        </label>
        <label class="field">Posljedice (1–5) *
          <input type="number" formControlName="posljedice" min="1" max="5" step="1">
          <span class="hint">Po zakonu 4. Mijenjajte samo ako imate osnov.</span>
        </label>
      </div>
    </fieldset>

    <fieldset class="sekcija" formGroupName="korisnik">
      <legend>Administrator</legend>
      <div class="grid2">
        <label class="field">Ime *
          <input type="text" formControlName="ime" autocomplete="given-name">
        </label>
        <label class="field">Prezime *
          <input type="text" formControlName="prezime" autocomplete="family-name">
        </label>
        <label class="field">Korisničko ime *
          <input type="text" formControlName="username" autocomplete="username">
        </label>
        <label class="field">E-mail *
          <input type="email" formControlName="email" autocomplete="email">
        </label>
        <label class="field">Lozinka *
          <input type="password" formControlName="password" autocomplete="new-password">
          <span class="hint">Najmanje 8 karaktera.</span>
        </label>
      </div>
    </fieldset>

    @if (greska()) {
      <p class="greska">{{ greska() }}</p>
    }

    <button class="btn lg" type="submit">Registruj firmu</button>
    <p class="note dno">Već imate nalog? <a routerLink="/prijava">Prijavite se</a></p>
  </form>
</div>
