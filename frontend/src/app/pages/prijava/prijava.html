<div class="wrap">
  <form class="login" [formGroup]="form" (ngSubmit)="prijaviSe()">
    <div class="logo lg">AML</div>
    <div class="naslov">
      <h1>Procjena rizika</h1>
      <p class="note">Prijavite se da biste nastavili.</p>
    </div>
    <label class="field">Korisničko ime
      <input type="text" formControlName="username" autocomplete="username">
    </label>
    <label class="field">Lozinka
      <input type="password" formControlName="password" autocomplete="current-password">
    </label>
    <label class="chk"><input type="checkbox" formControlName="rememberMe"> Zapamti me</label>
    @if (greska()) {
      <p class="greska">{{ greska() }}</p>
    }
    <button class="btn lg" type="submit">Prijava</button>
  </form>
</div>
