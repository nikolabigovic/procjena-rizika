<div class="wrap">
  <form class="login">
    <div class="logo lg">AML</div>
    <div class="naslov">
      <h1>Procjena rizika</h1>
      <p class="note">Prijavite se da biste nastavili.</p>
    </div>
    <label class="field">Korisničko ime
      <input type="text" name="korisnickoIme" autocomplete="username">
    </label>
    <label class="field">Lozinka
      <input type="password" name="lozinka" autocomplete="current-password">
    </label>
    <label class="chk"><input type="checkbox" name="zapamti"> Zapamti me</label>
    <!-- Za sada samo prelazi na listu klijenata (bez prijave). -->
    <a class="btn lg" routerLink="/klijenti">Prijava</a>
  </form>
</div>
